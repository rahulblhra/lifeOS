</style><style>#modal{color:#26372f}#modal .modal-wrap{--panel:#fff;--ink:#26372f;--bg:#f6f7f4;--line:#e8ece7;--muted:#839087}#modal .modal{color:var(--ink);background:var(--panel);border:1px solid #dce5dd;box-shadow:0 24px 80px #07170f70}#modal .modal h2{color:#25372f}#modal .field span{color:#506257}#modal .field input,#modal .field textarea,#modal .field select{background:#fbfcfa;color:#25372f;border-color:#ccd8cf}#modal .field input:focus,#modal .field textarea:focus,#modal .field select:focus{outline:2px solid #8bb99a;outline-offset:1px}</style></head><body><div id="app" class="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const today=()=>new Date().toISOString().slice(0,10),stamp=()=>new Date().toISOString(),uid=()=>crypto.randomUUID(),datePlus=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},dateTimePlus=(n,h=10)=>{let d=new Date();d.setDate(d.getDate()+n);d.setHours(h,0,0,0);return d.toISOString().slice(0,16)};
const demo={tasks:[{id:uid(),title:'Review monthly budget',description:'Check subscriptions and set savings target',dueDate:today(),priority:'High',category:'Personal',completed:false},{id:uid(),title:'Finish SQL practice',description:'Joins and relationships',dueDate:datePlus(1),priority:'Medium',category:'Learning',completed:false},{id:uid(),title:'Pick up groceries',description:'',dueDate:'',priority:'Low',category:'Home',completed:false}],expenses:[{id:uid(),amount:2480,date:today(),category:'Food',notes:'Groceries'},{id:uid(),amount:4200,date:datePlus(-2),category:'Bills',notes:'Electricity'},{id:uid(),amount:1770,date:datePlus(-4),category:'Transport',notes:'Metro card'}],shoppingItems:[{id:uid(),name:'Oats',quantity:'1 pack',category:'Groceries',purchased:false},{id:uid(),name:'Dish soap',quantity:'2 bottles',category:'Home',purchased:false},{id:uid(),name:'Coffee',quantity:'250 g',category:'Groceries',purchased:true}],learningGoals:[{id:uid(),title:'SQL fundamentals',targetDate:datePlus(30)}],learningTopics:[],reminders:[{id:uid(),title:'Pay electricity bill',description:'',dateTime:dateTimePlus(2,9),completed:false},{id:uid(),title:'Call the dentist',description:'Ask about a check-up',dateTime:dateTimePlus(5,11),completed:false}],settings:{theme:'light'}};
demo.learningTopics=[{id:uid(),goalId:demo.learningGoals[0].id,title:'SELECT and filtering',status:'Completed',notes:''},{id:uid(),goalId:demo.learningGoals[0].id,title:'Joins and relationships',status:'In Progress',notes:''},{id:uid(),goalId:demo.learningGoals[0].id,title:'Aggregations',status:'Not Started',notes:''},{id:uid(),goalId:demo.learningGoals[0].id,title:'Subqueries',status:'Not Started',notes:''}];let state=demo,page='Dashboard',filter='All',query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);const when=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{month:'short',day:'numeric'}):'No due date';const dtWhen=s=>new Date(s).toLocaleString('en-IN',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.className='toast';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{el.className='';el.textContent=''},2300)}
function shell(){let groups=[['WORKSPACE',['Dashboard','Tasks','Expenses']],['LIFE',['Learning Tracker','Reminders']],['PERSONAL',['Settings']]],icons={'Dashboard':'⌂','Tasks':'☷','Expenses':'◉','Learning Tracker':'▤','Reminders':'♧','Settings':'⚙'};return `<aside class="side"><div class="brand"><div class="brand-icon">✳</div><div>life<span style="color:#75a28d">os</span><small>YOUR PERSONAL SPACE</small></div></div><div id="navigation">${groups.map(([g,items])=>`<div class="group"><div class="label">${g}</div>${items.map(n=>`<div class="nav ${page===n?'active':''}" data-page="${n}"><span class="ico">${icons[n]}</span>${n}${n==='Tasks'?`<span class="nav-badge">${state.tasks.filter(x=>!x.completed).length}</span>`:''}</div>`).join('')}</div>`).join('')}</div><div class="sidefoot"><div class="privacy">✓ &nbsp;Your data stays yours<span>Preview data stays in this tab only</span></div><div class="profile"><div class="avatar">K</div><div>Your workspace<small>Interactive preview</small></div></div></div></aside><main class="main"><header class="top"><div class="crumb">Workspace <b>${esc(page)}</b></div><div class="top-right"><div class="today">${new Date().toLocaleDateString('en-IN',{weekday:'long',month:'long',day:'numeric'})}</div><button class="theme-btn" data-action="theme" title="Toggle theme">${state.settings.theme==='dark'?'☀':'☾'}</button></div></header><div class="content">${renderPage()}</div></main>`}
function render(){document.getElementById('app').innerHTML=shell();document.getElementById('app').classList.toggle('dark',state.settings.theme==='dark');document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{page=el.dataset.page;filter='All';query='';render()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>actions(el.dataset.action,el.dataset.id,el.dataset.store,el.dataset.kind));document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render()});document.querySelectorAll('[data-search]').forEach(el=>el.oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();let n=document.querySelector('[data-search]');n.focus();n.setSelectionRange(pos,pos)});document.querySelectorAll('[data-status]').forEach(el=>el.onchange=()=>{let t=state.learningTopics.find(t=>t.id===el.dataset.status);t.status=el.value;render()});}
function head(kicker,title,sub,addLabel){return `<div class="module-head"><div><div class="eyebrow">${kicker}</div><h1 class="h1">${title}</h1><div class="muted">${sub}</div></div>${addLabel?`<button class="btn primary" data-action="add">＋ &nbsp;${addLabel}</button>`:''}</div>`}
function stats(){let pending=state.tasks.filter(t=>!t.completed),overdue=pending.filter(t=>t.dueDate&&t.dueDate<today()).length,month=today().slice(0,7),spend=state.expenses.filter(e=>e.date.startsWith(month)).reduce((a,e)=>a+e.amount,0),shopping=state.shoppingItems.filter(x=>!x.purchased).length;return `<div class="stats"><div class="stat"><div class="stat-icon">☷</div><div class="stat-label">Tasks to focus on</div><div class="stat-value">${pending.length}<small>pending</small></div></div><div class="stat"><div class="stat-icon">◷</div><div class="stat-label">Past their due date</div><div class="stat-value">${overdue}<small>overdue</small></div></div><div class="stat"><div class="stat-icon">◉</div><div class="stat-label">Spent this month</div><div class="stat-value">${money(spend)}<small>this month</small></div></div></div>`}
function dashboard(){let pending=state.tasks.filter(t=>!t.completed).slice(0,3),rem=state.reminders.filter(x=>!x.completed&&x.dateTime>=stamp()).sort((a,b)=>a.dateTime.localeCompare(b.dateTime)).slice(0,2),goal=state.learningGoals[0],topics=goal?state.learningTopics.filter(t=>t.goalId===goal.id):[],done=topics.filter(t=>t.status==='Completed').length,next=topics.find(t=>t.status!=='Completed'),pct=topics.length?Math.round(done/topics.length*100):0,month=today().slice(0,7),spend=state.expenses.filter(e=>e.date.startsWith(month)).reduce((a,e)=>a+e.amount,0),max=Math.max(10000,spend);return `<div class="welcome"><div><div class="eyebrow"><i class="dot"></i>YOUR PERSONAL OVERVIEW</div><h1 class="h1">${new Date().toLocaleDateString('en-IN',{weekday:'long'})}, <span style="color:#84aa91">${new Date().toLocaleDateString('en-IN',{month:'long',day:'numeric'})}</span> ✳</h1><div class="muted">A little clarity goes a long way. Here’s your day at a glance.</div></div><button class="btn primary" data-action="add" data-kind="task">＋ &nbsp;New task</button></div>${stats()}<div class="sect"><div><h2>Your day</h2><span>A few things worth your attention</span></div><span class="link" data-page="Tasks">View all tasks →</span></div><div class="grid"><div class="panel"><div class="phead"><div><div class="eyebrow">A GOOD PLACE TO START</div><h3>Today's focus</h3></div><span class="badge">${pending.length} items</span></div>${pending.length?pending.map(t=>`<div class="task"><button class="circle" data-action="toggle" data-store="tasks" data-id="${t.id}" aria-label="Complete task"></button><div style="min-width:0"><span class="taskname">${esc(t.title)}</span><span class="sub">${t.dueDate?'Due '+when(t.dueDate):'No due date'} · ${esc(t.category||'Personal')}</span></div><span class="priority ${t.priority.toLowerCase()}">${t.priority}</span></div>`).join(''):`<div class="empty">You’re all caught up. Take a breath.</div>`}<div class="p-link" data-page="Tasks">Open task list →</div></div><div class="panel"><div class="phead"><div><div class="eyebrow">MONEY, MINDFULLY</div><h3>Monthly spending</h3></div></div><div class="total">${money(spend)}</div><span class="sub">recorded this month</span><div class="bar"><i style="width:${Math.min(100,spend/max*100)}%"></i></div><div class="p-link" data-page="Expenses">See expense details →</div></div><div class="panel"><div class="phead"><div><div class="eyebrow">DON’T FORGET</div><h3>Coming up</h3></div></div>${rem.length?rem.map(r=>`<div class="remind"><div class="date">${new Date(r.dateTime).toLocaleDateString('en-IN',{day:'2-digit'})}<small>${new Date(r.dateTime).toLocaleDateString('en-IN',{month:'short'}).toUpperCase()}</small></div><div><b>${esc(r.title)}</b><small>${new Date(r.dateTime).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}</small></div></div>`).join(''):`<div class="empty">Nothing coming up. Enjoy the space.</div>`}<div class="p-link" data-page="Reminders">All reminders →</div></div><div class="panel"><div class="phead"><div><div class="eyebrow">KEEP GROWING</div><h3>Your learning</h3></div></div>${goal?`<div class="learn">${esc(goal.title)}</div><div style="display:flex;gap:10px;align-items:center"><div class="progress" style="flex:1"><i style="width:${pct}%"></i></div><b style="font-size:9px;color:#67806e">${pct}%</b></div><span class="sub">Next up · ${next?esc(next.title):'All topics completed!'}</span>`:`<div class="empty">Add a learning goal to see your progress.</div>`}<div class="p-link" data-page="Learning Tracker">View learning tracker →</div></div></div><div class="note">✧ &nbsp;Small steps, taken consistently, add up to something meaningful.</div>`}
function taskView(){let items=state.tasks.filter(t=>(!query||`${t.title} ${t.category}`.toLowerCase().includes(query.toLowerCase()))&&(filter==='All'||filter==='Pending'&&!t.completed||filter==='Completed'&&t.completed||filter==='Overdue'&&!t.completed&&t.dueDate<today()||filter==='Upcoming'&&!t.completed&&t.dueDate>=today())).sort((a,b)=>Number(a.completed)-Number(b.completed)||(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));return `${head('MAKE SPACE FOR WHAT MATTERS','Tasks','A calm, clear list of what’s on your mind.','Add task')}<div class="toolbar"><input class="search" data-search placeholder="Search tasks…" value="${esc(query)}"><div class="tabs">${['All','Pending','Upcoming','Overdue','Completed'].map(x=>`<button class="tab ${filter===x?'selected':''}" data-filter="${x}">${x}</button>`).join('')}</div></div><div class="list">${items.length?items.map(t=>`<div class="record"><button class="circle ${t.completed?'checked':''}" data-action="toggle" data-store="tasks" data-id="${t.id}">${t.completed?'✓':''}</button><div class="record-main"><span class="record-title">${esc(t.title)}</span><span class="record-sub">${esc(t.description||t.category||'Personal')} ${t.dueDate?'· Due '+when(t.dueDate):''}</span></div><span class="priority ${t.priority.toLowerCase()}">${t.priority}</span><button class="action" data-action="edit" data-store="tasks" data-id="${t.id}">✎</button><button class="action" data-action="delete" data-store="tasks" data-id="${t.id}">×</button></div>`).join(''):`<div class="empty"><b>A fresh page</b>No tasks in this view. Add one thing you’d like to move forward.</div>`}</div>`}
function expensesView(){let month=today().slice(0,7),items=state.expenses.filter(e=>e.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)),total=items.reduce((n,e)=>n+e.amount,0),cats={};items.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount);let max=Math.max(1,...Object.values(cats));return `${head('SPEND WITH AWARENESS','Expenses','A simple picture of where your money goes.','Add expense')}<div class="panel" style="background:#edf5ee;margin-bottom:20px"><div class="eyebrow">THIS MONTH</div><div class="total">${money(total)}</div><span class="sub">${items.length} transaction${items.length===1?'':'s'} recorded</span><div style="margin-top:17px">${Object.entries(cats).map(([c,n])=>`<div class="category-row"><span>${esc(c)}</span><div class="progress"><i style="width:${n/max*100}%"></i></div><b>${money(n)}</b></div>`).join('')||'<span class="sub">Category totals appear when you add expenses.</span>'}</div></div><div class="sect"><div><h2>Recent expenses</h2><span>${new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span></div></div><div class="list">${items.length?items.map(e=>`<div class="record"><div class="round">◉</div><div class="record-main"><span class="record-title">${esc(e.category)}</span><span class="record-sub">${esc(e.notes||when(e.date))} · ${when(e.date)}</span></div><strong class="amount">${money(e.amount)}</strong><button class="action" data-action="edit" data-store="expenses" data-id="${e.id}">✎</button><button class="action" data-action="delete" data-store="expenses" data-id="${e.id}">×</button></div>`).join(''):`<div class="empty"><b>Nothing spent this month</b>Log an expense to see your monthly picture.</div>`}</div>`}
function shoppingView(){let items=state.shoppingItems.filter(x=>filter==='All'||filter==='To buy'&&!x.purchased||filter==='Purchased'&&x.purchased);return `${head('A LITTLE MORE PREPARED','Shopping list','Keep the essentials in one easy place.','Add item')}<div class="toolbar"><div class="tabs">${['To buy','Purchased','All'].map(x=>`<button class="tab ${filter===x?'selected':''}" data-filter="${x}">${x}${x==='To buy'?' ('+state.shoppingItems.filter(y=>!y.purchased).length+')':''}</button>`).join('')}</div>${state.shoppingItems.some(x=>x.purchased)?'<button class="btn" data-action="clear-purchased">Clear purchased</button>':''}</div><div class="list">${items.length?items.map(x=>`<div class="record"><button class="circle ${x.purchased?'checked':''}" data-action="toggle" data-store="shoppingItems" data-id="${x.id}">${x.purchased?'✓':''}</button><div class="record-main"><span class="record-title" style="${x.purchased?'text-decoration:line-through;color:#99a39c':''}">${esc(x.name)}</span><span class="record-sub">${esc(x.category||'General')} ${x.quantity?'· '+esc(x.quantity):''}</span></div><button class="action" data-action="edit" data-store="shoppingItems" data-id="${x.id}">✎</button><button class="action" data-action="delete" data-store="shoppingItems" data-id="${x.id}">×</button></div>`).join(''):`<div class="empty"><b>All caught up</b>Add things as they come to mind. You’ll thank yourself later.</div>`}</div>`}
function learningView(){return `${head('MAKE CURIOSITY A HABIT','Learning tracker','Small lessons today. New possibilities tomorrow.','New learning goal')}${state.learningGoals.length?state.learningGoals.map(g=>{let ts=state.learningTopics.filter(t=>t.goalId===g.id),done=ts.filter(t=>t.status==='Completed').length,p=ts.length?Math.round(done/ts.length*100):0;return `<div class="panel goal"><div class="phead"><div><div class="eyebrow">LEARNING GOAL</div><h3>${esc(g.title)}</h3></div><button class="action" data-action="delete" data-store="learningGoals" data-id="${g.id}">×</button></div><div class="progress"><i style="width:${p}%"></i></div><span class="sub">${done} of ${ts.length} topics completed · ${p}%${g.targetDate?' · target '+when(g.targetDate):''}</span>${ts.map(t=>`<div class="topic"><span>◦</span><span>${esc(t.title)}</span><select data-status="${t.id}"><option ${t.status==='Not Started'?'selected':''}>Not Started</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Completed'?'selected':''}>Completed</option></select><button class="action" data-action="edit" data-store="learningTopics" data-id="${t.id}">✎</button><button class="action" data-action="delete" data-store="learningTopics" data-id="${t.id}">×</button></div>`).join('')}<div class="goal-actions"><span class="link" data-action="add-topic" data-id="${g.id}">＋ Add topic</span><span class="sub">Progress updates as topics are completed</span></div></div>`}).join(''):`<div class="list"><div class="empty"><b>What are you curious about?</b>Create a goal, add topics, and keep your learning moving.</div></div>`}<div class="preview-tag">Try adding a goal or topic. Preview data stays in this tab only.</div>`}
function remindersView(){let items=state.reminders.filter(r=>filter==='All'||filter==='Completed'&&r.completed||filter==='Overdue'&&!r.completed&&r.dateTime<stamp()||filter==='Upcoming'&&!r.completed&&r.dateTime>=stamp()).sort((a,b)=>a.dateTime.localeCompare(b.dateTime));return `${head('A KIND NUDGE, WHEN YOU NEED IT','Reminders','Keep the important things close at hand.','New reminder')}<div class="callout">Reminders are shown while LifeOS is open. Browser reminders aren’t guaranteed when the app is closed.</div><div class="toolbar"><div class="tabs">${['Upcoming','Overdue','Completed','All'].map(x=>`<button class="tab ${filter===x?'selected':''}" data-filter="${x}">${x}</button>`).join('')}</div></div><div class="list">${items.length?items.map(r=>`<div class="record"><button class="circle ${r.completed?'checked':''}" data-action="toggle" data-store="reminders" data-id="${r.id}">${r.completed?'✓':''}</button><div class="record-main"><span class="record-title">${esc(r.title)}</span><span class="record-sub">${esc(r.description||dtWhen(r.dateTime))} · ${dtWhen(r.dateTime)}</span></div><button class="action" data-action="edit" data-store="reminders" data-id="${r.id}">✎</button><button class="action" data-action="delete" data-store="reminders" data-id="${r.id}">×</button></div>`).join(''):`<div class="empty"><b>A little room to breathe</b>No reminders in this view.</div>`}</div>`}
function settingsView(){let counts=['tasks','expenses','learningGoals','learningTopics','reminders'].map(s=>`<div class="category-row"><span>${s.replace(/[A-Z]/g,' $&').toLowerCase()}</span><b>${state[s].length}</b></div>`).join('');return `${head('MAKE LIFEOS FEEL LIKE YOURS','Settings','Your preferences, your data, your device.')}<div class="panel settings-block"><div class="phead"><div><h3>Appearance</h3><span class="sub">Choose the look that feels right.</span></div></div><button class="btn" data-action="theme">${state.settings.theme==='dark'?'☀ Switch to light':'☾ Switch to dark'}</button></div><div class="panel settings-block"><div class="phead"><div><h3>Your preview data</h3><span class="sub">This demo is temporary and stored only in page memory.</span></div></div>${counts}<div class="toolbar" style="margin-top:12px"><button class="btn" data-action="export">Export demo JSON</button><button class="btn danger" data-action="reset">Reset sample data</button></div><div class="privacy-copy">The full LifeOS app stores records in this browser’s IndexedDB. Clearing browser site data can erase them. IndexedDB is not encrypted storage. Exported backups may contain sensitive information.</div></div><div class="preview-tag">Interactive preview · Version 1.0</div>`}
function renderPage(){return page==='Dashboard'?dashboard():page==='Tasks'?taskView():page==='Expenses'?expensesView():page==='Learning Tracker'?learningView():page==='Reminders'?remindersView():settingsView()}
function actions(action,id,store,kind){if(action==='theme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';render();return}if(action==='add'){openForm(kind||({Tasks:'task',Expenses:'expense','Learning Tracker':'goal',Reminders:'reminder'}[page]||'task'));return}if(action==='add-topic'){openForm('topic',null,id);return}if(action==='toggle'){let obj=state[store].find(x=>x.id===id);if(obj)obj.completed!==undefined?obj.completed=!obj.completed:obj.purchased=!obj.purchased;render();return}if(action==='delete'){if(!confirm('Delete this item from the preview?'))return;state[store]=state[store].filter(x=>x.id!==id);render();return}if(action==='edit'){openForm(({tasks:'task',expenses:'expense',shoppingItems:'shopping',learningGoals:'goal',learningTopics:'topic',reminders:'reminder'})[store],state[store].find(x=>x.id===id));return}if(action==='clear-purchased'){if(confirm('Remove all purchased sample items?')){state.shoppingItems=state.shoppingItems.filter(x=>!x.purchased);render()}return}if(action==='reset'){if(confirm('Reset the preview to its sample data?'))location.reload();return}if(action==='export'){let blob=new Blob([JSON.stringify({app:'LifeOS preview',exportedAt:stamp(),data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lifeos-preview-data.json';a.click();URL.revokeObjectURL(a.href);toast('Demo data exported');}}
function openForm(kind,item=null,goalId=null){let titles={task:item?'Edit task':'Add a task',expense:item?'Edit expense':'Add an expense',shopping:item?'Edit item':'Add to shopping list',goal:'Create a learning goal',topic:item?'Edit topic':'Add a learning topic',reminder:item?'Edit reminder':'Create a reminder'},f=item||{},field=(label,key,type='text',placeholder='')=>`<label class="field"><span>${label}</span><input name="${key}" type="${type}" value="${esc(f[key]??'')}" placeholder="${placeholder}" ${['title','name','amount','date','dateTime'].includes(key)?'required':''}></label>`,select=(label,key,opts,val)=>`<label class="field"><span>${label}</span><select name="${key}">${opts.map(x=>`<option ${x===(f[key]||val)?'selected':''}>${x}</option>`).join('')}</select></label>`;let body='';if(kind==='task')body=field('Task title','title','text','What needs doing?')+`<label class="field"><span>Description</span><textarea name="description">${esc(f.description||'')}</textarea></label><div class="formrow">${field('Due date','dueDate','date')}${select('Priority','priority',['Low','Medium','High'],'Medium')}</div>${field('Category','category','text','Personal')}`;if(kind==='expense')body=field('Amount (INR)','amount','number','0.00')+`<div class="formrow">${field('Date','date','date')}${select('Category','category',['Food','Transport','Shopping','Bills','Health','Home','Learning','Other'],'Food')}</div>${field('Notes','notes','text','Optional details')}`;if(kind==='shopping')body=field('Item','name','text','What do you need?')+`<div class="formrow">${field('Quantity','quantity','text','e.g. 2 packs')}${field('Category','category','text','Groceries')}</div>`;if(kind==='goal')body=field('Learning goal','title','text','e.g. Learn Python')+field('Target date','targetDate','date')+'<label class="field"><span>Subtopics (one per line, optional)</span><textarea name="subtopics" placeholder="e.g. Variables&#10;Functions&#10;Practice project"></textarea></label>'; if(kind==='topic')body=field('Topic','title','text','What will you learn next?')+select('Status','status',['Not Started','In Progress','Completed'],'Not Started')+`<label class="field"><span>Progress notes</span><textarea name="notes">${esc(f.notes||'')}</textarea></label>`;if(kind==='reminder')body=field('Reminder title','title','text','What should you remember?')+field('Date and time','dateTime','datetime-local')+`<label class="field"><span>Description</span><textarea name="description">${esc(f.description||'')}</textarea></label>`;document.getElementById('modal').innerHTML=`<div class="modal-wrap"><form class="modal" id="form"><button type="button" class="close" data-action="close">×</button><div class="eyebrow">A MOMENT FOR YOURSELF</div><h2>${titles[kind]}</h2><p>${kind==='reminder'?'Shown in the app while it is open.':'Your changes update this interactive preview immediately.'}</p>${body}<div class="modal-actions"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary">${item?'Save changes':'Save'}</button></div></form></div>`;document.querySelectorAll('[data-action="close"]').forEach(b=>b.onclick=()=>document.getElementById('modal').innerHTML='');document.getElementById('form').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),o=Object.fromEntries(fd.entries()),subtopics=kind==='goal'?String(o.subtopics||'').split(/[\n,]/).map(x=>x.trim()).filter(Boolean):[];delete o.subtopics;if(kind==='expense'){o.amount=Number(o.amount);if(o.amount<=0)return}if(kind==='reminder')o.dateTime=new Date(o.dateTime).toISOString();let collection={task:'tasks',expense:'expenses',shopping:'shoppingItems',goal:'learningGoals',topic:'learningTopics',reminder:'reminders'}[kind];if(kind==='topic')o.goalId=item?.goalId||goalId||state.learningGoals[0]?.id;if(item){Object.assign(item,o)}else{let obj={...o,id:uid()};if(kind==='task'){obj.completed=false;obj.createdAt=stamp();obj.updatedAt=stamp()}if(kind==='shopping')obj.purchased=false;if(kind==='reminder'){obj.completed=false;obj.createdAt=stamp()}state[collection].push(obj);if(kind==='goal')subtopics.forEach(title=>state.learningTopics.push({id:uid(),goalId:obj.id,title,status:'Not Started',notes:''}))}document.getElementById('modal').innerHTML='';render();toast(item?'Changes saved':'Added to preview')};}
render();
</script></body></html>
